  <!-- wordmark -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="256" y="112" font-size="66" font-weight="700" fill="#f3f4f6">discopt<tspan fill="#4f46e5">-</tspan>aggregation</text>
    <text x="258" y="164" font-size="30" font-weight="500" fill="#9ca3af" letter-spacing="0.5">variable aggregation for nonlinear optimization</text>
